version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: chatbot-mongodb
    environment:
      MONGO_INITDB_DATABASE: chatbot_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatbot-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/chatbot_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: chatbot_db
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./Banking Demo File.xlsx:/app/Banking Demo File.xlsx
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chatbot-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chatbot-network
    command: npm run dev -- --host

volumes:
  mongodb_data:

networks:
  chatbot-network:
    driver: bridge
